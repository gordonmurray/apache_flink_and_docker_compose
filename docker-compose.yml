x-flink: &flink
  build: .
  image: local/flink-cdc-demo:2.2.1
  environment: &flink-environment
    CDC_PASSWORD: ${CDC_PASSWORD:-cdc_demo_password}
    SINK_PASSWORD: ${SINK_PASSWORD:-sink_demo_password}
    FLINK_PROPERTIES: |
      jobmanager.rpc.address: jobmanager
      rest.address: jobmanager
      rest.bind-address: 0.0.0.0
      parallelism.default: 2
      taskmanager.numberOfTaskSlots: 2
      execution.checkpointing.interval: 10s
      execution.checkpointing.mode: EXACTLY_ONCE
      execution.checkpointing.min-pause: 5s
      execution.checkpointing.timeout: 120s
      execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
      state.backend.type: hashmap
      execution.checkpointing.dir: file:///opt/flink/checkpoints
      execution.checkpointing.savepoint-dir: file:///opt/flink/savepoints
      restart-strategy.type: fixed-delay
      restart-strategy.fixed-delay.attempts: 10
      restart-strategy.fixed-delay.delay: 5s
      heartbeat.interval: 2000
      heartbeat.timeout: 10000
  volumes:
    - flink-checkpoints:/opt/flink/checkpoints
    - flink-savepoints:/opt/flink/savepoints

services:
  mariadb:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_demo_password}
      CDC_PASSWORD: ${CDC_PASSWORD:-cdc_demo_password}
      SINK_PASSWORD: ${SINK_PASSWORD:-sink_demo_password}
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./sql/mariadb.cnf:/etc/mysql/conf.d/cdc.cnf:ro
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/users.sh:/docker-entrypoint-initdb.d/02-users.sh:ro
    ports:
      - "127.0.0.1:${MARIADB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  jobmanager:
    <<: *flink
    command: jobmanager
    ports:
      - "127.0.0.1:${FLINK_UI_PORT:-8081}:8081"
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/overview"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  taskmanager:
    <<: *flink
    command: taskmanager
    depends_on:
      jobmanager:
        condition: service_healthy
    deploy:
      replicas: 2

volumes:
  mariadb-data:
  flink-checkpoints:
  flink-savepoints:
